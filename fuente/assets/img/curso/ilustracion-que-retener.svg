<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"
     aria-label="Tres páginas seguidas de un documento, llenas de texto corrido, cortadas arriba y abajo porque el texto sigue. En la página del centro, un solo bloque lleva rótulo en su pestaña, Idea clave, y es el único que se despega de la página: queda levantado, con sombra, sobre el hueco que deja. En la página de la derecha, otro bloque con rótulo, Dato curioso, sigue plano dentro del texto.">
  <!-- Ilustración de marca · Scala Learning · Curso demo, tema 5 (apertura)
       Concepto (texto de la pantalla): «Esta familia resuelve una sola pregunta: de todo lo
       que hay que leer, ¿qué hay que retener? Cada componente tiene un rótulo que el diseño
       instruccional escribe en el Word. Ese rótulo es lo que el Arquitecto OVA lee para
       elegir el componente».
       Mucho que leer (tres páginas cortadas); lo que se retiene es el bloque con rótulo,
       que se levanta de la página. El dato curioso «acompaña la lectura»: se queda plano.
       Guion en insumos/ILUSTRACIONES.md. Único amarillo: la pestaña con el rótulo. -->
  <defs>
    <linearGradient id="ilu-queretener-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F1ECF7"/>
      <stop offset="55%"  stop-color="#F4EFE7"/>
      <stop offset="100%" stop-color="#FBF7EF"/>
    </linearGradient>
    <filter id="ilu-queretener-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#303651" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ilu-queretener-marco">
      <rect width="1200" height="420" rx="18"/>
    </clipPath>
    <!-- Una página de texto corrido: las mismas líneas en las tres páginas -->
    <g id="ilu-queretener-prosa" fill="#303651" opacity=".20">
      <rect x="28" y="30"  width="244" height="8" rx="4"/>
      <rect x="28" y="50"  width="244" height="8" rx="4"/>
      <rect x="28" y="70"  width="212" height="8" rx="4"/>
      <rect x="28" y="90"  width="244" height="8" rx="4"/>
      <rect x="28" y="110" width="160" height="8" rx="4"/>
      <rect x="28" y="140" width="244" height="8" rx="4"/>
      <rect x="28" y="160" width="244" height="8" rx="4"/>
      <rect x="28" y="180" width="236" height="8" rx="4"/>
      <rect x="28" y="200" width="244" height="8" rx="4"/>
      <rect x="28" y="220" width="190" height="8" rx="4"/>
      <rect x="28" y="250" width="244" height="8" rx="4"/>
      <rect x="28" y="270" width="244" height="8" rx="4"/>
      <rect x="28" y="290" width="204" height="8" rx="4"/>
      <rect x="28" y="310" width="244" height="8" rx="4"/>
      <rect x="28" y="330" width="244" height="8" rx="4"/>
      <rect x="28" y="350" width="132" height="8" rx="4"/>
      <rect x="28" y="380" width="244" height="8" rx="4"/>
      <rect x="28" y="400" width="244" height="8" rx="4"/>
      <rect x="28" y="420" width="220" height="8" rx="4"/>
      <rect x="28" y="440" width="244" height="8" rx="4"/>
      <rect x="28" y="460" width="244" height="8" rx="4"/>
      <rect x="28" y="480" width="176" height="8" rx="4"/>
    </g>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#ilu-queretener-fondo)"/>

  <g clip-path="url(#ilu-queretener-marco)">
    <!-- ══ Todo lo que hay que leer: tres páginas seguidas, cortadas arriba y abajo ══ -->
    <g filter="url(#ilu-queretener-sombra)">
      <rect x="120" y="-40" width="300" height="500" rx="16" fill="#FFFFFF"/>
      <rect x="450" y="-40" width="300" height="500" rx="16" fill="#FFFFFF"/>
      <rect x="780" y="-40" width="300" height="500" rx="16" fill="#FFFFFF"/>
    </g>
    <use href="#ilu-queretener-prosa" x="120" y="-40"/>
    <use href="#ilu-queretener-prosa" x="450" y="-40"/>
    <use href="#ilu-queretener-prosa" x="780" y="-40"/>

    <!-- ══ Página del centro · el hueco que deja el bloque al levantarse ══ -->
    <rect x="470" y="176" width="260" height="100" rx="8" fill="#FFFFFF"
          stroke="#CFC8E4" stroke-width="2" stroke-dasharray="7 6"/>

    <!-- ══ Lo que hay que retener: el bloque con rótulo, despegado de la página ══ -->
    <g filter="url(#ilu-queretener-sombra)">
      <rect x="456" y="142" width="288" height="112" rx="8" fill="#FBF8F3" stroke="#CFC8E4" stroke-width="2"/>
    </g>
    <path d="M456 174 V150 a8 8 0 0 1 8 -8 H736 a8 8 0 0 1 8 8 V174 Z" fill="#F8B716"/>
    <text x="474" y="165" font-family="DM Sans, system-ui, sans-serif" font-size="17"
          font-weight="700" fill="#303651">Idea clave</text>
    <rect x="474" y="190" width="228" height="9" rx="4.5" fill="#303651" opacity=".55"/>
    <rect x="474" y="208" width="196" height="9" rx="4.5" fill="#303651" opacity=".35"/>
    <rect x="474" y="226" width="150" height="9" rx="4.5" fill="#303651" opacity=".35"/>

    <!-- ══ Página de la derecha · el dato curioso acompaña la lectura: se queda plano ══ -->
    <rect x="808" y="296" width="244" height="80" rx="8" fill="#FBF8F3" stroke="#CFC8E4" stroke-width="2"/>
    <path d="M808 324 V304 a8 8 0 0 1 8 -8 H1044 a8 8 0 0 1 8 8 V324 Z" fill="#E7E1F3"/>
    <text x="824" y="315" font-family="DM Sans, system-ui, sans-serif" font-size="16"
          font-weight="600" fill="#503B96">Dato curioso</text>
    <rect x="824" y="338" width="196" height="8" rx="4" fill="#303651" opacity=".30"/>
    <rect x="824" y="354" width="140" height="8" rx="4" fill="#303651" opacity=".30"/>
  </g>
</svg>
