<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"
     aria-label="A la izquierda, una hoja del Word con un bloque rotulado Recorrido que trae tres partes seguidas, cada una encabezada por la palabra Paso 1, Paso 2 y Paso 3 y con su título y su descripción. A la derecha, las mismas tres partes separadas y en fila, en orden: cada una lleva un número en un círculo violeta y, dentro, exactamente el mismo título y la misma descripción; la palabra Paso ya no aparece.">
  <!-- Ilustración de marca · Scala Learning · Curso demo, tema 6 (apertura)
       Concepto (texto de la pantalla): «el contenido que tiene partes es el más frecuente:
       pasos, ítems, tipos, eventos» · «el número lo pone el componente; el título y la
       descripción, el Word» · «Si el Word rotula cada paso con "Paso 1", "Paso 2", ese
       rótulo sirve para leer el documento, no para la pantalla».
       Las partes del Word (con su "Paso N") se separan y quedan en fila, completas y en
       orden; el numeral es nuevo, el texto es el mismo <use>.
       Guion en insumos/ILUSTRACIONES.md. Único amarillo: la pestaña con el rótulo. -->
  <defs>
    <linearGradient id="ilu-conpartes-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F1ECF7"/>
      <stop offset="55%"  stop-color="#F4EFE7"/>
      <stop offset="100%" stop-color="#FBF7EF"/>
    </linearGradient>
    <filter id="ilu-conpartes-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#303651" flood-opacity="0.16"/>
    </filter>
    <!-- Una parte: su título y su descripción. Es la misma en el Word y en la fila:
         eso es lo que el Word pone. -->
    <g id="ilu-conpartes-parte" fill="#303651">
      <rect        width="150" height="10" rx="5" opacity=".82"/>
      <rect y="20" width="168" height="8"  rx="4" opacity=".38"/>
      <rect y="34" width="120" height="8"  rx="4" opacity=".38"/>
    </g>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#ilu-conpartes-fondo)"/>

  <!-- ══ La hoja del Word ══ -->
  <g filter="url(#ilu-conpartes-sombra)">
    <rect x="60" y="30" width="340" height="376" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="88" y="58"  width="140" height="11" rx="5.5" fill="#303651" opacity=".82"/>
  <rect x="88" y="86"  width="284" height="8"  rx="4"   fill="#303651" opacity=".20"/>
  <rect x="88" y="102" width="230" height="8"  rx="4"   fill="#303651" opacity=".20"/>

  <!-- El bloque con rótulo: lo que tiene partes -->
  <rect x="88" y="128" width="284" height="252" rx="8" fill="#FBF8F3" stroke="#CFC8E4" stroke-width="2"/>
  <path d="M88 158 V136 a8 8 0 0 1 8 -8 H364 a8 8 0 0 1 8 8 V158 Z" fill="#F8B716"/>
  <text x="104" y="149" font-family="DM Sans, system-ui, sans-serif" font-size="17"
        font-weight="700" fill="#303651">Recorrido:</text>

  <!-- Las tres partes, seguidas, cada una con su "Paso N" del Word -->
  <g font-family="DM Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#303651" opacity=".78">
    <text x="104" y="182">Paso 1</text>
    <text x="104" y="248">Paso 2</text>
    <text x="104" y="314">Paso 3</text>
  </g>
  <use href="#ilu-conpartes-parte" x="104" y="192"/>
  <use href="#ilu-conpartes-parte" x="104" y="258"/>
  <use href="#ilu-conpartes-parte" x="104" y="324"/>

  <!-- ══ Del bloque a la fila ══ -->
  <path d="M382 254 C 426 254, 426 211, 468 211" fill="none" stroke="#503B96" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="7 7" opacity=".5"/>
  <path d="M460 203 l8 8 -8 8" fill="none" stroke="#503B96" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>

  <!-- ══ Las mismas partes, separadas y en orden: el número lo pone el componente ══ -->
  <g filter="url(#ilu-conpartes-sombra)">
    <rect x="480" y="136" width="200" height="150" rx="14" fill="#FFFFFF"/>
    <rect x="704" y="136" width="200" height="150" rx="14" fill="#FFFFFF"/>
    <rect x="928" y="136" width="200" height="150" rx="14" fill="#FFFFFF"/>
  </g>
  <g font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <circle cx="510" cy="174" r="17" fill="#503B96"/><text x="510" y="180">1</text>
    <circle cx="734" cy="174" r="17" fill="#503B96"/><text x="734" y="180">2</text>
    <circle cx="958" cy="174" r="17" fill="#503B96"/><text x="958" y="180">3</text>
  </g>
  <use href="#ilu-conpartes-parte" x="504" y="212"/>
  <use href="#ilu-conpartes-parte" x="728" y="212"/>
  <use href="#ilu-conpartes-parte" x="952" y="212"/>

  <!-- el orden entre partes -->
  <g fill="none" stroke="#503B96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".45">
    <path d="M688 203 l8 8 -8 8"/>
    <path d="M912 203 l8 8 -8 8"/>
  </g>
</svg>
