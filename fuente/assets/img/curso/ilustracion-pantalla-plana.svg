<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="Dos pantallas iguales, lado a lado. La de la izquierda está hecha solo de tarjetas destacadas, todas del mismo tamaño y una detrás de otra. La de la derecha lleva los bloques como texto y, cada dos o tres, una pieza gráfica marcada en amarillo que rompe la columna.">
  <!-- Ilustración de marca · Scala Learning · Curso demo, tema 2 (apertura)
       Concepto (texto de la pantalla): «Una pantalla de puras tarjetas se lee plana por
       muchos destacados que tenga. Cada dos o tres bloques conviene una pieza que rompa
       la lectura y, sobre todo, que explique.»
       Izquierda: la columna de puras tarjetas, todas iguales. Derecha: la misma columna
       con texto y, tras dos bloques, la pieza gráfica que la rompe.
       Guion en insumos/ILUSTRACIONES.md. Único amarillo: la pieza gráfica. -->
  <defs>
    <linearGradient id="ilu-pantallaplana-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F1ECF7"/>
      <stop offset="55%"  stop-color="#F4EFE7"/>
      <stop offset="100%" stop-color="#FBF7EF"/>
    </linearGradient>
    <filter id="ilu-pantallaplana-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#303651" flood-opacity="0.16"/>
    </filter>
    <!-- Una tarjeta destacada: etiqueta y una línea. Todas idénticas: eso es lo plano -->
    <g id="ilu-pantallaplana-tarjeta">
      <rect width="376" height="42" rx="10" fill="#EFECF7"/>
      <rect x="20" y="12" width="52" height="7" rx="3.5" fill="#503B96" opacity=".55"/>
      <rect x="20" y="26" width="300" height="7" rx="3.5" fill="#303651" opacity=".22"/>
    </g>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#ilu-pantallaplana-fondo)"/>

  <!-- Separación entre las dos pantallas -->
  <line x1="600" y1="56" x2="600" y2="344" stroke="#303651" stroke-width="2" opacity=".14"/>

  <!-- ══ Pantalla 1 · de puras tarjetas ══ -->
  <g filter="url(#ilu-pantallaplana-sombra)">
    <rect x="120" y="34" width="440" height="332" rx="18" fill="#FFFFFF"/>
  </g>
  <rect x="152" y="62" width="196" height="11" rx="5.5" fill="#303651" opacity=".82"/>
  <line x1="152" y1="90" x2="528" y2="90" stroke="#EFEAE3" stroke-width="2"/>

  <use href="#ilu-pantallaplana-tarjeta" x="152" y="108"/>
  <use href="#ilu-pantallaplana-tarjeta" x="152" y="158"/>
  <use href="#ilu-pantallaplana-tarjeta" x="152" y="208"/>
  <use href="#ilu-pantallaplana-tarjeta" x="152" y="258"/>
  <use href="#ilu-pantallaplana-tarjeta" x="152" y="308"/>

  <!-- ══ Pantalla 2 · la misma, con una pieza cada dos o tres bloques ══ -->
  <g filter="url(#ilu-pantallaplana-sombra)">
    <rect x="640" y="34" width="440" height="332" rx="18" fill="#FFFFFF"/>
  </g>
  <rect x="672" y="62" width="196" height="11" rx="5.5" fill="#303651" opacity=".82"/>
  <line x1="672" y1="90" x2="1048" y2="90" stroke="#EFEAE3" stroke-width="2"/>

  <!-- bloque de texto 1 -->
  <g fill="#303651" opacity=".24">
    <rect x="672" y="110" width="376" height="7" rx="3.5"/>
    <rect x="672" y="126" width="352" height="7" rx="3.5"/>
    <rect x="672" y="142" width="286" height="7" rx="3.5"/>
  </g>
  <!-- bloque de texto 2 -->
  <g fill="#303651" opacity=".24">
    <rect x="672" y="166" width="376" height="7" rx="3.5"/>
    <rect x="672" y="182" width="318" height="7" rx="3.5"/>
  </g>

  <!-- la pieza gráfica: más ancha que la columna de texto, rompe la lectura -->
  <rect x="656" y="204" width="408" height="80" rx="14" fill="#FFFFFF" stroke="#F8B716" stroke-width="3.5"/>
  <!-- dentro de la pieza: una rueda pequeña con sus pasos al lado -->
  <circle cx="712" cy="250" r="19" fill="none" stroke="#503B96" stroke-width="8"
          stroke-dasharray="22.8 7"/>
  <g>
    <rect x="766" y="229" width="86" height="42" rx="8" fill="#EFECF7"/>
    <rect x="778" y="241" width="40" height="6" rx="3" fill="#503B96" opacity=".5"/>
    <rect x="778" y="254" width="62" height="6" rx="3" fill="#303651" opacity=".2"/>
  </g>
  <g>
    <rect x="864" y="229" width="86" height="42" rx="8" fill="#EFECF7"/>
    <rect x="876" y="241" width="40" height="6" rx="3" fill="#503B96" opacity=".5"/>
    <rect x="876" y="254" width="62" height="6" rx="3" fill="#303651" opacity=".2"/>
  </g>
  <g>
    <rect x="962" y="229" width="86" height="42" rx="8" fill="#EFECF7"/>
    <rect x="974" y="241" width="40" height="6" rx="3" fill="#503B96" opacity=".5"/>
    <rect x="974" y="254" width="62" height="6" rx="3" fill="#303651" opacity=".2"/>
  </g>

  <!-- el texto sigue después de la pieza -->
  <g fill="#303651" opacity=".24">
    <rect x="672" y="298" width="376" height="7" rx="3.5"/>
    <rect x="672" y="314" width="344" height="7" rx="3.5"/>
    <rect x="672" y="330" width="250" height="7" rx="3.5"/>
  </g>
</svg>
